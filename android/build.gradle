import com.android.Version

group = "flutter.curiosity"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def isAgp9OrAbove = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger() >= 9

// AGP 9 enables built-in Kotlin by default, but apps can disable it with android.builtInKotlin=false.
def builtInKotlinEnabled = isAgp9OrAbove && providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .getOrElse(true)

apply plugin: 'com.android.library'
if (!builtInKotlinEnabled) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    namespace = "flutter.curiosity"

    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }
}

if (!builtInKotlinEnabled) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}