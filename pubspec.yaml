name: flutter_curiosity
description: Integrates native and platform features for Android, iOS, macOS, HarmonyOS, Windows, Linux and web, including GPS, keyboard, apps and image saving.
version: 8.0.0
homepage: https://github.com/Wayaer/flutter_curiosity
repository: https://github.com/Wayaer/flutter_curiosity.git
issue_tracker: https://github.com/Wayaer/flutter_curiosity/issues

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

topics:
  - plugin
  - android
  - ios
  - macos
  - harmonyos

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: flutter.curiosity
        pluginClass: CuriosityPlugin
      ohos:
        pluginClass: CuriosityPlugin
      ios:
        pluginClass: CuriosityPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: CuriosityPlugin
        sharedDarwinSource: true
      web:
        pluginClass: CuriosityPluginWeb
        fileName: flutter_curiosity_web.dart
      windows:
        dartPluginClass: CuriosityPluginWindows
      linux:
        dartPluginClass: CuriosityPluginLinux
